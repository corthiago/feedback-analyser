spring.application.name=feedback-analyser

# Logging configuration
logging.level.com.thiago=DEBUG
logging.level.org.springframework.web=INFO

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-3.7-flash
gemini.generation.temperature=0.7
gemini.generation.max-output-tokens=1024
