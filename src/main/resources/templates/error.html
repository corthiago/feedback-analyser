<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Customer Feedback Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-950 px-4 text-slate-100">
<div class="w-full max-w-md rounded-xl border border-rose-500/30 bg-slate-900 shadow-lg shadow-black/20">
    <div class="flex items-center gap-2 border-b border-slate-800 px-6 py-4">
        <span class="h-2 w-2 rounded-full bg-rose-500"></span>
        <h1 class="text-sm font-semibold uppercase tracking-wide text-rose-400">Error</h1>
    </div>
    <div class="space-y-4 px-6 py-6">
        <p class="text-sm text-slate-300" th:text="${error}">An error occurred.</p>
        <p class="text-sm text-slate-500">Please ensure that the sentiment analysis has been run and the output file exists.</p>
        <a href="/"
           class="inline-flex w-full items-center justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-indigo-500">
            Try Again
        </a>
    </div>
</div>
</body>
</html>
