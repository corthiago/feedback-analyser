<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Feedback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<nav class="sticky top-0 z-10 border-b border-slate-800 bg-slate-950/80 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <div class="flex items-center gap-2">
            <span class="h-2 w-2 rounded-full bg-indigo-500"></span>
            <span class="text-lg font-semibold tracking-tight text-white">Retail Store Customer Feedback Dashboard</span>
        </div>
        <a href="/"
           class="inline-flex items-center gap-1.5 rounded-lg border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 transition-colors hover:border-indigo-500 hover:text-white">
            Back to Dashboard
        </a>
    </div>
</nav>

<main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-2xl">
        <div class="rounded-xl border border-slate-800 bg-slate-900 shadow-lg shadow-black/20">
            <div class="border-b border-slate-800 px-6 py-4">
                <h1 class="text-sm font-semibold uppercase tracking-wide text-slate-400">Submit New Feedback</h1>
            </div>
            <form method="post" th:action="@{/feedback}" class="space-y-5 px-6 py-6">
                <div>
                    <label class="mb-1.5 block text-sm font-medium text-slate-300" for="customer">Customer</label>
                    <input type="text" id="customer" name="customer" required
                           class="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-slate-100 placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40">
                </div>
                <div>
                    <label class="mb-1.5 block text-sm font-medium text-slate-300" for="department">Department</label>
                    <select id="department" name="department" required
                            class="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-slate-100 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40">
                        <option value="" disabled selected>Select a department</option>
                        <option value="Returns">Returns</option>
                        <option value="Customer Service">Customer Service</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Checkout">Checkout</option>
                        <option value="Product Selection">Product Selection</option>
                        <option value="Online Shopping">Online Shopping</option>
                        <option value="Home Goods">Home Goods</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Grocery">Grocery</option>
                        <option value="Store Environment">Store Environment</option>
                    </select>
                </div>
                <div>
                    <label class="mb-1.5 block text-sm font-medium text-slate-300" for="comment">Comment</label>
                    <textarea id="comment" name="comment" rows="4" required
                              class="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-slate-100 placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"></textarea>
                </div>
                <button type="submit"
                        class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-indigo-500">
                    Submit Feedback
                </button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
