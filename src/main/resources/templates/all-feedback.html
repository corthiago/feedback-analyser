<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Feedback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<nav class="sticky top-0 z-10 border-b border-slate-800 bg-slate-950/80 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <div class="flex items-center gap-2">
            <span class="h-2 w-2 rounded-full bg-indigo-500"></span>
            <span class="text-lg font-semibold tracking-tight text-white">Retail Store Customer Feedback Dashboard</span>
        </div>
        <div class="flex items-center gap-3">
            <a href="/"
               class="inline-flex items-center gap-1.5 rounded-lg border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 transition-colors hover:border-indigo-500 hover:text-white">
                Back to Dashboard
            </a>
            <a href="/feedback/new"
               class="inline-flex items-center gap-1.5 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-indigo-500">
                <span>+</span> New Feedback
            </a>
        </div>
    </div>
</nav>

<main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <div th:if="${error}" class="mb-6 rounded-lg border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-sm text-rose-300" th:text="${error}"></div>

    <section class="rounded-xl border border-slate-800 bg-slate-900 shadow-lg shadow-black/20">
        <div class="border-b border-slate-800 px-6 py-4">
            <h1 class="text-sm font-semibold uppercase tracking-wide text-slate-400">
                All Feedback <span class="text-slate-600">(<span th:text="${feedbackList.size()}">0</span>)</span>
            </h1>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead>
                <tr class="border-b border-slate-800 text-xs uppercase tracking-wide text-slate-500">
                    <th class="px-6 py-3 font-medium">ID</th>
                    <th class="px-6 py-3 font-medium">Customer</th>
                    <th class="px-6 py-3 font-medium">Department</th>
                    <th class="px-6 py-3 font-medium">Date</th>
                    <th class="px-6 py-3 font-medium">Comment</th>
                    <th class="px-6 py-3 font-medium">
                        <span class="inline-flex items-center gap-1">Sentiment
                            <span class="inline-flex items-center rounded-full bg-indigo-500/10 px-1.5 py-0.5 text-[9px] font-semibold normal-case tracking-normal text-indigo-300 ring-1 ring-inset ring-indigo-500/30">&#10024; AI</span>
                        </span>
                    </th>
                    <th class="px-6 py-3 font-medium">
                        <span class="inline-flex items-center gap-1">Category
                            <span class="inline-flex items-center rounded-full bg-indigo-500/10 px-1.5 py-0.5 text-[9px] font-semibold normal-case tracking-normal text-indigo-300 ring-1 ring-inset ring-indigo-500/30">&#10024; AI</span>
                        </span>
                    </th>
                    <th class="px-6 py-3 font-medium">
                        <span class="inline-flex items-center gap-1">Insight
                            <span class="inline-flex items-center rounded-full bg-indigo-500/10 px-1.5 py-0.5 text-[9px] font-semibold normal-case tracking-normal text-indigo-300 ring-1 ring-inset ring-indigo-500/30">&#10024; AI</span>
                        </span>
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="feedback : ${feedbackList}"
                    th:with="sentimentClass=${feedback.sentiment == 'Positive' or feedback.sentiment == 'VERY_POSITIVE' ? 'bg-emerald-500/15 text-emerald-400 ring-emerald-500/30' : (feedback.sentiment == 'Negative' or feedback.sentiment == 'VERY_NEGATIVE' ? 'bg-rose-500/15 text-rose-400 ring-rose-500/30' : 'bg-slate-500/15 text-slate-300 ring-slate-500/30')}"
                    class="border-b border-slate-800/60 transition-colors last:border-0 hover:bg-slate-800/40">
                    <td class="px-6 py-3 text-slate-400" th:text="${feedback.id}">1</td>
                    <td class="px-6 py-3 text-slate-200" th:text="${feedback.customer}">John Doe</td>
                    <td class="px-6 py-3 text-slate-300" th:text="${feedback.department}">Electronics</td>
                    <td class="whitespace-nowrap px-6 py-3 text-slate-400">
                        <span class="block" th:text="${#temporals.format(feedback.date, 'MMM d, yyyy')}">Feb 15, 2023</span>
                        <span class="block text-xs text-slate-500" th:text="${#temporals.format(feedback.date, 'h:mm a')}">12:00 AM</span>
                    </td>
                    <td class="max-w-xs px-6 py-3 text-slate-300" th:text="${feedback.comment}">Great service!</td>
                    <td class="px-6 py-3">
                                <span th:class="'inline-flex items-center rounded-full px-2.5 py-1 text-xs font-medium ring-1 ring-inset ' + ${sentimentClass}"
                                      th:text="${feedback.sentiment}">Positive</span>
                    </td>
                    <td class="px-6 py-3 text-slate-300" th:text="${feedback.category}">Customer Service</td>
                    <td class="max-w-xs px-6 py-3">
                        <div class="rounded-r-lg border-l-2 border-indigo-500 bg-slate-800/60 px-3 py-2 text-xs text-slate-300"
                             th:text="${feedback.actionableInsight}">
                            Recognize staff for excellent service.
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
